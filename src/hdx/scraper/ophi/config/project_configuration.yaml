showcaseinfo:
  # https://docs.google.com/spreadsheets/d/1mChJ1UhgLtqLD-hqbFxd5eKq-L7Nz6awD2znBcEkASs/edit?gid=0#gid=0
  urls: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPXtof5E54tGcQcDOUVwKMV9Kelkt_KqyiYCfGtSUg1B7EoMe7lfoVIHeaL2ij6fyxytplaJQojxyp/pub?gid=0&single=true&output=csv"
  notes: "The visual contains sub-national multidimensional poverty data from the country briefs published by the Oxford Poverty and Human Development Initiative (OPHI), University of Oxford."

headers:
   - "Country ISO3"
   - "Admin 1 PCode"
   - "Admin 1 Name"
   - "MPI"
   - "Headcount Ratio"
   - "Intensity of Deprivation"
   - "Vulnerable to Poverty"
   - "In Severe Poverty"
   - "Survey"
   - "Start Date"
   - "End Date"

# Columns of global MPI and MPI trends resources (schema_001 in
# oxford-poverty-human-development-initiative_schemas.xlsx)
data_dictionary:
  - field: Country ISO3
    label: Country ISO3
    data_type: text
    description: "ISO 3166-1 alpha-3 country code"
  - field: Admin 1 PCode
    label: Admin 1 P-code
    data_type: text
    description: "P-code of the first-level administrative unit (admin 1). Blank for national rows and for regions with no matching admin 1 P-code."
  - field: Admin 1 Name
    label: Admin 1 name
    data_type: text
    description: "Name of the subnational region the survey reports. Usually an admin 1 unit, in some countries an admin 2 unit or a survey region. Blank for national rows."
  - field: MPI
    label: MPI
    data_type: numeric
    description: "Product of the multidimensional poverty headcount ratio (H) and the average intensity of deprivation (A), MPI = H × A."
  - field: Headcount Ratio
    label: Headcount ratio
    data_type: numeric
    description: "Percentage of the population that is multidimensionally poor."
  - field: Intensity of Deprivation
    label: Intensity of deprivation
    data_type: numeric
    description: "Average percentage of weighted deprivations experienced by multidimensionally poor people."
  - field: Vulnerable to Poverty
    label: Vulnerable to poverty
    data_type: numeric
    description: "Percentage of the population experiencing a weighted deprivation score of 20% or more but less than 33.33%."
  - field: In Severe Poverty
    label: In severe poverty
    data_type: numeric
    description: "Percentage of the population experiencing a weighted deprivation score of 50% or more."
  - field: Survey
    label: Survey
    data_type: text
    description: "Survey or data source used to estimate the MPI and related estimates, given as an acronym such as DHS or MICS."
  - field: Start Date
    label: Start date
    data_type: timestamp without time zone
    description: "First day (January 1) of the survey's first year."
  - field: End Date
    label: End date
    data_type: timestamp without time zone
    description: "Last day (December 31) of the survey's last year."

resource_descriptions:
  standardised_mpi: "This resource contains standardised MPI estimates by first-level administrative unit (e.g. state, province) and also shows the proportion of people who are MPI poor and experience deprivations in each of the indicators by admin one unit."
  standardised_trends: "This resource contains standardised MPI estimates and their changes over time by first-level administrative unit (e.g. state, province) and also shows the proportion of people who are MPI poor and experience deprivations in each of the indicators by admin one unit."
  mpi_national: "This table shows the MPI and its partial indices"
  mpi_subnational: "This table shows the MPI and its partial indices disaggregated by subnational regions"
  trends: "This table shows global mpi harmonized level estimates and their changes over time"

